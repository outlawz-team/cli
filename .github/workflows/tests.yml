name: Tests

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/pest
